# Course and lesson pages that were published and then removed on purpose ("Site settings → Removed
# pages" in the admin editor). The build fails when a page that git history shows was deleted or
# renamed is now nothing (scripts/removed-pages.mjs): learners lose their progress for it and old
# links break. If a page moved, add its old address to the new page's `aliases` instead.
# Each address also covers everything under it: a course's address covers all of its lessons.
pages: []
