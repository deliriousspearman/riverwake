<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- The site's link-preview image (static/images/social/codex.png), in the home page hero's style.
       Fonts: Chakra Petch, Figtree and JetBrains Mono (the site's). Render it to PNG at 1200×630
       with any SVG renderer that has those fonts installed, e.g. Inkscape or resvg. -->
  <rect width="1200" height="630" fill="#111927"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#2c3a52" stroke-width="2"/>
  <!-- Logo and name, as in the navbar -->
  <rect x="80" y="76" width="52" height="52" rx="2" fill="#9fef00"/>
  <text x="106" y="111" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="22" fill="#0e1a02">&gt;_</text>
  <text x="150" y="114" font-family="'Chakra Petch', sans-serif" font-weight="700" font-size="34" fill="#ffffff">Codex</text>
  <!-- Title -->
  <rect x="80" y="200" width="64" height="6" fill="#9fef00"/>
  <text x="80" y="300" font-family="'Chakra Petch', sans-serif" font-weight="700" font-size="76" fill="#ffffff">Learn cyber</text>
  <text x="80" y="384" font-family="'Chakra Petch', sans-serif" font-weight="700" font-size="76" fill="#ffffff">security</text>
  <text x="80" y="448" font-family="'Figtree', sans-serif" font-size="28" fill="#a4b1cd">Free, self-paced courses.</text>
  <text x="80" y="488" font-family="'Figtree', sans-serif" font-size="28" fill="#a4b1cd">No sign-up required.</text>
  <!-- The hero's terminal -->
  <rect x="640" y="168" width="480" height="300" fill="#0d1420" stroke="#2c3a52" stroke-width="2"/>
  <rect x="641" y="169" width="478" height="40" fill="#1a2332"/>
  <circle cx="666" cy="189" r="6" fill="#ff3e3e"/>
  <circle cx="686" cy="189" r="6" fill="#ffaf00"/>
  <circle cx="706" cy="189" r="6" fill="#9fef00"/>
  <text x="880" y="195" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="16" fill="#a4b1cd">learner@codex: ~</text>
  <g font-family="'JetBrains Mono', monospace" font-size="18">
    <text x="666" y="256" fill="#a4b1cd"><tspan fill="#9fef00">$</tspan> ./start --pace=self --account=none</text>
    <text x="666" y="298" fill="#c5f467">[+] No sign-up needed</text>
    <text x="666" y="340" fill="#c5f467">[+] Progress saved in this browser</text>
    <text x="666" y="382" fill="#c5f467">[+] Videos and recordings ready</text>
    <text x="666" y="424" fill="#a4b1cd"><tspan fill="#9fef00">$</tspan></text>
    <rect x="688" y="408" width="11" height="20" fill="#9fef00"/>
  </g>
</svg>
